<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Dagstaat Tuindorpbad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { border-bottom: 3px solid #059669; color: #059669; font-weight: 600; }
    input, textarea, select { font-size: 16px !important; } /* voorkomt zoom op iOS */
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold leading-tight">Dagstaat</h1>
        <p class="text-emerald-100 text-xs">Tuindorpbad Hengelo</p>
      </div>
      <div class="text-2xl">🏊</div>
    </div>

    <!-- Tabs -->
    <div class="max-w-lg mx-auto flex">
      <button id="tab-form" onclick="showTab('form')" class="flex-1 py-3 text-center text-sm tab-active bg-emerald-800/30">
        Invullen
      </button>
      <button id="tab-list" onclick="showTab('list')" class="flex-1 py-3 text-center text-sm text-emerald-100">
        Overzicht
      </button>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-5 pb-24">

    <!-- ========== FORMULIER ========== -->
    <section id="panel-form">
      <form id="dagstaat-form" class="space-y-4" onsubmit="saveEntry(event)">

        <!-- Datum + Naam -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Datum</label>
            <input type="date" id="datum" required
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Naam</label>
            <input type="text" id="naam" required placeholder="Jouw naam"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" />
          </div>
        </div>

        <!-- Watertemperatuur -->
        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <label class="block text-sm font-medium text-slate-600 mb-1">Watertemperatuur (°C)</label>
          <input type="number" id="temp" step="0.1" placeholder="bijv. 23.0"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>

        <!-- Jeugd / 65+ -->
        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <h2 class="text-sm font-semibold text-slate-700 mb-3">Jeugd / 65+</h2>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Eindnummer</label>
              <input type="number" id="eind_jeugd" min="0" placeholder="bijv. 03044"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Aantal</label>
              <input type="number" id="aantal_jeugd" min="0" placeholder="0"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
          </div>
        </div>

        <!-- Volwassenen -->
        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <h2 class="text-sm font-semibold text-slate-700 mb-3">Volwassenen</h2>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Eindnummer</label>
              <input type="number" id="eind_volwassenen" min="0" placeholder="bijv. 65098"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Aantal</label>
              <input type="number" id="aantal_volwassenen" min="0" placeholder="0"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
          </div>
        </div>

        <!-- Teller + Totaal -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <label class="block text-xs text-slate-500 mb-1">Teller</label>
            <input type="number" id="teller" min="0" placeholder="0"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <label class="block text-xs text-slate-500 mb-1">Totaal</label>
            <input type="number" id="totaal" min="0" placeholder="0"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
        </div>

        <!-- Dagstaat / Bijzonderheden -->
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Dagstaat / Bijzonderheden</label>
          <textarea id="dagstaat" rows="5" placeholder="Bijzonderheden, incidenten, weer, sfeer, opmerkingen…&#10;&#10;Je kunt hier meerdere alinea's schrijven."
            class="w-full border border-slate-300 rounded-xl px-3 py-3 bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none resize-y"></textarea>
        </div>

        <!-- Opslaan knop -->
        <button type="submit" id="btn-save"
          class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-3.5 rounded-xl shadow-md transition-colors text-base">
          Opslaan
        </button>

        <p id="form-message" class="text-center text-sm hidden"></p>
      </form>
    </section>

    <!-- ========== OVERZICHT ========== -->
    <section id="panel-list" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">Opgeslagen dagstaten</h2>
        <button onclick="downloadExcel()"
          class="text-sm bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3 py-1.5 rounded-lg shadow-sm">
          ↓ Excel
        </button>
      </div>

      <div id="entries-list" class="space-y-3">
        <!-- wordt gevuld door JS -->
      </div>

      <p id="list-empty" class="text-center text-slate-400 py-10 hidden">
        Nog geen dagstaten opgeslagen.
      </p>
    </section>

  </main>

  <!-- Status balk onderaan -->
  <div id="status-bar" class="fixed bottom-0 left-0 right-0 bg-slate-800 text-slate-200 text-xs text-center py-1.5 hidden">
    <span id="status-text"></span>
  </div>

<script>
  // ============================================
  // CONFIGURATIE – hier later Supabase invullen
  // ============================================
  const SUPABASE_URL = 'https://uxxkqjvxyqhwlzkdespg.supabase.co';          // updated and inserted 3 aug 2026
  const SUPABASE_ANON_KEY = 'sb_publishable_pyP15yoQluntYhAWwFlhig_a9tqrAH8';     // updated and inserted, non anon key (legacy) but updated public key. 3 aug 2026

  let supabase = null;
  if (SUPABASE_URL && SUPABASE_ANON_KEY) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  // ============================================
  // Helpers
  // ============================================
  function todayISO() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }

  function showTab(tab) {
    document.getElementById('panel-form').classList.toggle('hidden', tab !== 'form');
    document.getElementById('panel-list').classList.toggle('hidden', tab !== 'list');
    document.getElementById('tab-form').classList.toggle('tab-active', tab === 'form');
    document.getElementById('tab-list').classList.toggle('tab-active', tab === 'list');
    document.getElementById('tab-form').classList.toggle('text-emerald-100', tab !== 'form');
    document.getElementById('tab-list').classList.toggle('text-emerald-100', tab !== 'list');
    if (tab === 'list') loadEntries();
  }

  function showMessage(text, isError = false) {
    const el = document.getElementById('form-message');
    el.textContent = text;
    el.className = 'text-center text-sm ' + (isError ? 'text-red-600' : 'text-emerald-600');
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 4000);
  }

  // ============================================
  // LocalStorage (werkt altijd, ook zonder Supabase)
  // ============================================
  function getLocalEntries() {
    try {
      return JSON.parse(localStorage.getItem('tuindorpbad_dagstaten') || '[]');
    } catch {
      return [];
    }
  }

  function saveLocalEntry(entry) {
    const list = getLocalEntries();
    list.unshift(entry);
    localStorage.setItem('tuindorpbad_dagstaten', JSON.stringify(list));
  }

  // ============================================
  // Opslaan
  // ============================================
  async function saveEntry(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Bezig…';

    const entry = {
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
      datum: document.getElementById('datum').value,
      naam: document.getElementById('naam').value.trim(),
      temp: document.getElementById('temp').value ? parseFloat(document.getElementById('temp').value) : null,
      eind_jeugd: document.getElementById('eind_jeugd').value ? parseInt(document.getElementById('eind_jeugd').value) : null,
      aantal_jeugd: document.getElementById('aantal_jeugd').value ? parseInt(document.getElementById('aantal_jeugd').value) : null,
      eind_volwassenen: document.getElementById('eind_volwassenen').value ? parseInt(document.getElementById('eind_volwassenen').value) : null,
      aantal_volwassenen: document.getElementById('aantal_volwassenen').value ? parseInt(document.getElementById('aantal_volwassenen').value) : null,
      teller: document.getElementById('teller').value ? parseInt(document.getElementById('teller').value) : null,
      totaal: document.getElementById('totaal').value ? parseInt(document.getElementById('totaal').value) : null,
      dagstaat: document.getElementById('dagstaat').value.trim(),
      created_at: new Date().toISOString()
    };

    // Stap 1: altijd lokaal opslaan (fallback + offline). Dit mag nooit
    // verloren gaan, dus dit zit buiten de try/catch voor Supabase.
    let localSaveOk = true;
    try {
      saveLocalEntry(entry);
    } catch (err) {
      console.error('Lokaal opslaan mislukt:', err);
      localSaveOk = false;
    }

    // Stap 2: probeer ook naar Supabase te sturen als geconfigureerd.
    // Een fout hier mag de lokale opslag/reset niet blokkeren.
    let cloudSaveOk = false;
    let cloudError = null;
    if (supabase) {
      try {
        const { error } = await supabase.from('dagstaten').insert([{
          datum: entry.datum,
          naam: entry.naam,
          temp: entry.temp,
          eind_jeugd: entry.eind_jeugd,
          aantal_jeugd: entry.aantal_jeugd,
          eind_volwassenen: entry.eind_volwassenen,
          aantal_volwassenen: entry.aantal_volwassenen,
          teller: entry.teller,
          totaal: entry.totaal,
          dagstaat: entry.dagstaat
        }]);
        if (error) throw error;
        cloudSaveOk = true;
      } catch (err) {
        console.error('Supabase opslaan mislukt:', err);
        cloudError = err;
      }
    }

    // Stap 3: boodschap tonen op basis van wat er echt gebeurd is
    if (!localSaveOk && !cloudSaveOk) {
      showMessage('Fout bij opslaan: niets is opgeslagen. Probeer opnieuw.' +
        (cloudError ? ' (' + (cloudError.message || cloudError) + ')' : ''), true);
    } else if (supabase && cloudSaveOk) {
      showMessage('Opgeslagen in de cloud ✓');
    } else if (supabase && !cloudSaveOk) {
      showMessage('Opgeslagen op dit apparaat ✓ — cloud opslaan mislukt (' +
        (cloudError ? (cloudError.message || cloudError) : 'onbekende fout') +
        '). Wordt lokaal bewaard.', true);
    } else {
      showMessage('Opgeslagen op dit apparaat ✓ (Supabase nog niet gekoppeld)');
    }

    // Stap 4: formulier resetten (behalve datum) — altijd, zolang de
    // lokale opslag (de betrouwbare fallback) is gelukt.
    if (localSaveOk) {
      document.getElementById('naam').value = '';
      document.getElementById('temp').value = '';
      document.getElementById('eind_jeugd').value = '';
      document.getElementById('aantal_jeugd').value = '';
      document.getElementById('eind_volwassenen').value = '';
      document.getElementById('aantal_volwassenen').value = '';
      document.getElementById('teller').value = '';
      document.getElementById('totaal').value = '';
      document.getElementById('dagstaat').value = '';
    }

    btn.disabled = false;
    btn.textContent = 'Opslaan';
  }

  // ============================================
  // Overzicht laden
  // ============================================
  async function loadEntries() {
    const container = document.getElementById('entries-list');
    const empty = document.getElementById('list-empty');
    container.innerHTML = '<p class="text-center text-slate-400 py-6">Laden…</p>';

    let cloudEntries = [];
    let cloudFailed = false;

    if (supabase) {
      const { data, error } = await supabase
        .from('dagstaten')
        .select('*')
        .order('datum', { ascending: false })
        .order('created_at', { ascending: false });
      if (!error && data) {
        cloudEntries = data;
      } else {
        cloudFailed = true;
        console.error('Kon dagstaten niet laden uit Supabase:', error);
      }
    }

    // Altijd samenvoegen met lokale data (niet alleen als fallback), zodat
    // items die alleen lokaal bestaan (bijv. opgeslagen vóór koppeling, of
    // offline) niet verdwijnen zodra er cloud-data is.
    const local = getLocalEntries();
    const seen = new Set(cloudEntries.map(e => e.id).filter(Boolean));
    const localOnly = local.filter(e => !seen.has(e.id));
    let entries = [...cloudEntries, ...localOnly];

    // Op datum + created_at sorteren, zoals de cloud-query ook doet
    entries.sort((a, b) => {
      const d = (b.datum || '').localeCompare(a.datum || '');
      if (d !== 0) return d;
      return (b.created_at || '').localeCompare(a.created_at || '');
    });

    const warningHtml = cloudFailed
      ? '<p class="text-center text-red-500 text-sm py-2 mb-2">⚠️ Kon niet met de cloud verbinden — dit zijn alleen de lokale gegevens op dit apparaat.</p>'
      : '';

    if (entries.length === 0) {
      container.innerHTML = warningHtml;
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    container.innerHTML = warningHtml + entries.map(e => `
      <article class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
        <div class="flex justify-between items-start mb-2">
          <div>
            <div class="font-semibold text-slate-800">${e.datum || '—'}</div>
            <div class="text-sm text-slate-500">${e.naam || ''}</div>
          </div>
          <div class="text-right text-sm">
            ${e.totaal != null ? `<div class="font-medium text-emerald-700">${e.totaal} bezoekers</div>` : ''}
            ${e.temp != null ? `<div class="text-slate-500">${e.temp}°C</div>` : ''}
          </div>
        </div>
        <div class="text-xs text-slate-500 grid grid-cols-2 gap-1 mb-2">
          ${e.aantal_jeugd != null ? `<span>Jeugd/65+: ${e.aantal_jeugd} (eind ${e.eind_jeugd ?? '—'})</span>` : ''}
          ${e.aantal_volwassenen != null ? `<span>Volwassenen: ${e.aantal_volwassenen} (eind ${e.eind_volwassenen ?? '—'})</span>` : ''}
          ${e.teller != null ? `<span>Teller: ${e.teller}</span>` : ''}
        </div>
        ${e.dagstaat ? `<p class="text-sm text-slate-700 whitespace-pre-wrap border-t border-slate-100 pt-2 mt-2">${e.dagstaat}</p>` : ''}
      </article>
    `).join('');
  }

  // ============================================
  // Excel / CSV download
  // ============================================
  function downloadExcel() {
    let entries = getLocalEntries();

    if (entries.length === 0) {
      alert('Geen gegevens om te downloaden.');
      return;
    }

    const headers = [
      'Datum','Naam','Temp','Eind Jeugd/65+','Aantal Jeugd/65+',
      'Eind Volwassenen','Aantal Volwassenen','Teller','Totaal','Dagstaat','Opgeslagen op'
    ];

    const rows = entries.map(e => [
      e.datum || '',
      e.naam || '',
      e.temp ?? '',
      e.eind_jeugd ?? '',
      e.aantal_jeugd ?? '',
      e.eind_volwassenen ?? '',
      e.aantal_volwassenen ?? '',
      e.teller ?? '',
      e.totaal ?? '',
      (e.dagstaat || '').replace(/"/g, '""'),
      e.created_at || ''
    ]);

    let csv = headers.join(';') + '\n';
    rows.forEach(r => {
      csv += r.map(cell => `"${cell}"`).join(';') + '\n';
    });

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tuindorpbad-dagstaten-${todayISO()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ============================================
  // Start
  // ============================================
  document.getElementById('datum').value = todayISO();

  // Toon status of we cloud of alleen lokaal gebruiken.
  // Belangrijk: createClient() faalt nooit, ook niet met een verkeerde
  // URL/key — dus we testen de verbinding hier echt met een lichte query,
  // in plaats van te doen alsof "geconfigureerd" hetzelfde is als "werkt".
  const status = document.getElementById('status-bar');
  const statusText = document.getElementById('status-text');
  status.classList.remove('hidden');

  if (supabase) {
    statusText.textContent = 'Verbinden met Supabase…';
    supabase
      .from('dagstaten')
      .select('id', { count: 'exact', head: true })
      .then(({ error }) => {
        if (error) {
          console.error('Supabase verbindingstest mislukt:', error);
          statusText.textContent = '⚠️ Supabase niet bereikbaar (' +
            (error.message || 'onbekende fout') +
            ') — werkt nu lokaal';
          status.classList.remove('bg-slate-800');
          status.classList.add('bg-red-800');
        } else {
          statusText.textContent = 'Verbonden met Supabase ✓';
        }
      })
      .catch(err => {
        console.error('Supabase verbindingstest mislukt:', err);
        statusText.textContent = '⚠️ Supabase niet bereikbaar — werkt nu lokaal';
        status.classList.remove('bg-slate-800');
        status.classList.add('bg-red-800');
      });
  } else {
    statusText.textContent = 'Demo-modus (alleen dit apparaat) – koppel Supabase via de code';
  }
</script>
</body>
</html>
