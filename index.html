<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Dagstaat Tuindorpbad</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { border-bottom: 3px solid #059669; color: #059669; font-weight: 600; }
    input, textarea, select { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold leading-tight">Dagstaat</h1>
        <p class="text-emerald-100 text-xs">Tuindorpbad Hengelo</p>
      </div>
      <div class="text-2xl">🏊</div>
    </div>
    <div class="max-w-lg mx-auto flex">
      <button id="tab-form" onclick="showTab('form')" class="flex-1 py-3 text-center text-sm tab-active bg-emerald-800/30">
        Invullen
      </button>
      <button id="tab-list" onclick="showTab('list')" class="flex-1 py-3 text-center text-sm text-emerald-100">
        Overzicht
      </button>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-5 pb-24">

    <section id="panel-form">
      <form id="dagstaat-form" class="space-y-4" onsubmit="saveEntry(event)">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Datum</label>
            <input type="date" id="datum" required
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Naam</label>
            <input type="text" id="naam" required placeholder="Jouw naam"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <label class="block text-sm font-medium text-slate-600 mb-1">Watertemperatuur (°C)</label>
          <input type="number" id="temp" step="0.1" placeholder="bijv. 23.0"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>

        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <h2 class="text-sm font-semibold text-slate-700 mb-3">Jeugd / 65+</h2>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Eindnummer</label>
              <input type="number" id="eind_jeugd" min="0" placeholder="bijv. 03044"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Aantal</label>
              <input type="number" id="aantal_jeugd" min="0" placeholder="0"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
          </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <h2 class="text-sm font-semibold text-slate-700 mb-3">Volwassenen</h2>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Eindnummer</label>
              <input type="number" id="eind_volwassenen" min="0" placeholder="bijv. 65098"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Aantal</label>
              <input type="number" id="aantal_volwassenen" min="0" placeholder="0"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <label class="block text-xs text-slate-500 mb-1">Teller</label>
            <input type="number" id="teller" min="0" placeholder="0"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <label class="block text-xs text-slate-500 mb-1">Totaal</label>
            <input type="number" id="totaal" min="0" placeholder="0"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Dagstaat / Bijzonderheden</label>
          <textarea id="dagstaat" rows="5" placeholder="Bijzonderheden, incidenten, weer, sfeer…"
            class="w-full border border-slate-300 rounded-xl px-3 py-3 bg-white focus:ring-2 focus:ring-emerald-500 outline-none resize-y"></textarea>
        </div>

        <button type="submit" id="btn-save"
          class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-3.5 rounded-xl shadow-md text-base">
          Opslaan
        </button>
        <p id="form-message" class="text-center text-sm hidden"></p>
      </form>
    </section>

    <section id="panel-list" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">Opgeslagen dagstaten</h2>
        <div class="flex gap-2">
          <button onclick="loadEntries()" class="text-sm bg-white border border-slate-300 px-3 py-1.5 rounded-lg">↻</button>
          <button onclick="downloadExcel()" class="text-sm bg-white border border-slate-300 px-3 py-1.5 rounded-lg">↓ Excel</button>
        </div>
      </div>
      <div id="entries-list" class="space-y-3"></div>
      <p id="list-empty" class="text-center text-slate-400 py-10 hidden">Nog geen dagstaten opgeslagen.</p>
    </section>

  </main>

  <div id="status-bar" class="fixed bottom-0 left-0 right-0 bg-slate-800 text-slate-200 text-xs text-center py-2 z-30">
    <span id="status-text">Verbinden…</span>
  </div>

<script>
  // v3 – 3 aug 2026 – cloud first, geen cache-gedoe
  const SUPABASE_URL = 'https://uxxkqjvxyqhwlzkdespg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_pyP15yoQluntYhAWwFlhig_a9tqrAH8';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let lastLoadedEntries = []; // voor Excel export (altijd de cloud-data)

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\"/g, '&quot;');
  }

  function showTab(tab) {
    document.getElementById('panel-form').classList.toggle('hidden', tab !== 'form');
    document.getElementById('panel-list').classList.toggle('hidden', tab !== 'list');
    document.getElementById('tab-form').classList.toggle('tab-active', tab === 'form');
    document.getElementById('tab-list').classList.toggle('tab-active', tab === 'list');
    document.getElementById('tab-form').classList.toggle('text-emerald-100', tab !== 'form');
    document.getElementById('tab-list').classList.toggle('text-emerald-100', tab !== 'list');
    if (tab === 'list') loadEntries();
  }

  function showMessage(text, isError) {
    const el = document.getElementById('form-message');
    el.textContent = text;
    el.className = 'text-center text-sm ' + (isError ? 'text-red-600' : 'text-emerald-600');
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 5000);
  }

  function setStatus(text, ok) {
    const bar = document.getElementById('status-bar');
    const el = document.getElementById('status-text');
    el.textContent = text;
    bar.className = 'fixed bottom-0 left-0 right-0 text-xs text-center py-2 z-30 ' +
      (ok === true ? 'bg-emerald-800 text-white' :
       ok === false ? 'bg-red-800 text-white' :
       'bg-slate-800 text-slate-200');
  }

  async function saveEntry(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Bezig…';

    const payload = {
      datum: document.getElementById('datum').value,
      naam: document.getElementById('naam').value.trim(),
      temp: document.getElementById('temp').value ? parseFloat(document.getElementById('temp').value) : null,
      eind_jeugd: document.getElementById('eind_jeugd').value ? parseInt(document.getElementById('eind_jeugd').value) : null,
      aantal_jeugd: document.getElementById('aantal_jeugd').value ? parseInt(document.getElementById('aantal_jeugd').value) : null,
      eind_volwassenen: document.getElementById('eind_volwassenen').value ? parseInt(document.getElementById('eind_volwassenen').value) : null,
      aantal_volwassenen: document.getElementById('aantal_volwassenen').value ? parseInt(document.getElementById('aantal_volwassenen').value) : null,
      teller: document.getElementById('teller').value ? parseInt(document.getElementById('teller').value) : null,
      totaal: document.getElementById('totaal').value ? parseInt(document.getElementById('totaal').value) : null,
      dagstaat: document.getElementById('dagstaat').value.trim()
    };

    try {
      const { data, error } = await supabase.from('dagstaten').insert([payload]).select();
      if (error) throw error;

      showMessage('Opgeslagen in de cloud ✓');
      document.getElementById('naam').value = '';
      document.getElementById('temp').value = '';
      document.getElementById('eind_jeugd').value = '';
      document.getElementById('aantal_jeugd').value = '';
      document.getElementById('eind_volwassenen').value = '';
      document.getElementById('aantal_volwassenen').value = '';
      document.getElementById('teller').value = '';
      document.getElementById('totaal').value = '';
      document.getElementById('dagstaat').value = '';

      setTimeout(() => showTab('list'), 600);
    } catch (err) {
      console.error(err);
      showMessage('FOUT bij opslaan: ' + (err.message || err), true);
      setStatus('Opslaan mislukt: ' + (err.message || err), false);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Opslaan';
    }
  }

  async function loadEntries() {
    const container = document.getElementById('entries-list');
    const empty = document.getElementById('list-empty');
    container.innerHTML = '<p class="text-center text-slate-400 py-6">Laden uit cloud…</p>';
    empty.classList.add('hidden');

    try {
      const { data, error } = await supabase
        .from('dagstaten')
        .select('*')
        .order('datum', { ascending: false })
        .order('created_at', { ascending: false });

      if (error) throw error;

      lastLoadedEntries = data || [];
      setStatus('Verbonden ✓ — ' + lastLoadedEntries.length + ' dagstaat(en) in cloud', true);

      if (lastLoadedEntries.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      container.innerHTML = lastLoadedEntries.map(e => `
        <article class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <div class="flex justify-between items-start mb-2">
            <div>
              <div class="font-semibold text-slate-800">${esc(e.datum)}</div>
              <div class="text-sm text-slate-500">${esc(e.naam)}</div>
            </div>
            <div class="text-right text-sm">
              ${e.totaal != null ? `<div class="font-medium text-emerald-700">${esc(e.totaal)} bezoekers</div>` : ''}
              ${e.temp != null ? `<div class="text-slate-500">${esc(e.temp)}°C</div>` : ''}
            </div>
          </div>
          <div class="text-xs text-slate-500 grid grid-cols-2 gap-1 mb-2">
            ${e.aantal_jeugd != null ? `<span>Jeugd/65+: ${esc(e.aantal_jeugd)} (eind ${esc(e.eind_jeugd ?? '—')})</span>` : ''}
            ${e.aantal_volwassenen != null ? `<span>Volwassenen: ${esc(e.aantal_volwassenen)} (eind ${esc(e.eind_volwassenen ?? '—')})</span>` : ''}
            ${e.teller != null ? `<span>Teller: ${esc(e.teller)}</span>` : ''}
          </div>
          ${e.dagstaat ? `<p class="text-sm text-slate-700 whitespace-pre-wrap border-t border-slate-100 pt-2 mt-2">${esc(e.dagstaat)}</p>` : ''}
        </article>
      `).join('');
    } catch (err) {
      console.error(err);
      container.innerHTML = '<p class="text-center text-red-600 py-6">Kon cloud niet laden:<br>' + esc(err.message || err) + '</p>';
      setStatus('Cloud fout: ' + (err.message || err), false);
      lastLoadedEntries = [];
    }
  }

  function downloadExcel() {
    const entries = lastLoadedEntries;
    if (!entries.length) {
      alert('Geen gegevens. Open eerst Overzicht zodat de cloud-data geladen is.');
      return;
    }

    const headers = [
      'Datum','Naam','Temp','Eind Jeugd/65+','Aantal Jeugd/65+',
      'Eind Volwassenen','Aantal Volwassenen','Teller','Totaal','Dagstaat','Opgeslagen op'
    ];
    const rows = entries.map(e => [
      e.datum || '', e.naam || '', e.temp ?? '', e.eind_jeugd ?? '', e.aantal_jeugd ?? '',
      e.eind_volwassenen ?? '', e.aantal_volwassenen ?? '', e.teller ?? '', e.totaal ?? '',
      (e.dagstaat || '').replace(/\"/g, '\"\"'), e.created_at || ''
    ]);

    let csv = headers.join(';') + '\n';
    rows.forEach(r => { csv += r.map(c => `\"${c}\"`).join(';') + '\n'; });

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tuindorpbad-dagstaten-' + todayISO() + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById('datum').value = todayISO();

  (async function init() {
    try {
      const { count, error } = await supabase
        .from('dagstaten')
        .select('*', { count: 'exact', head: true });
      if (error) throw error;
      setStatus('Verbonden ✓ — ' + (count ?? 0) + ' dagstaat(en) in cloud', true);
    } catch (err) {
      console.error(err);
      setStatus('GEEN VERBINDING: ' + (err.message || err), false);
    }
  })();
</script>
</body>
</html>
