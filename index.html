<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Dagstaat Tuindorpbad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { border-bottom: 3px solid #059669; color: #059669; font-weight: 600; }
    input, textarea, select { font-size: 16px !important; } /* voorkomt zoom op iOS */
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold leading-tight">Dagstaat</h1>
        <p class="text-emerald-100 text-xs">Tuindorpbad Hengelo</p>
      </div>
      <div class="text-2xl">🏊</div>
    </div>

    <!-- Tabs -->
    <div class="max-w-lg mx-auto flex">
      <button id="tab-form" onclick="showTab('form')" class="flex-1 py-3 text-center text-sm tab-active bg-emerald-800/30">
        Invullen
      </button>
      <button id="tab-list" onclick="showTab('list')" class="flex-1 py-3 text-center text-sm text-emerald-100">
        Overzicht
      </button>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-5 pb-24">

    <!-- ========== FORMULIER ========== -->
    <section id="panel-form">
      <form id="dagstaat-form" class="space-y-4" onsubmit="saveEntry(event)">

        <!-- Datum + Naam -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Datum</label>
            <input type="date" id="datum" required
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Naam</label>
            <input type="text" id="naam" required placeholder="Jouw naam"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" />
          </div>
        </div>

        <!-- Ticketnummers -->
        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <h2 class="text-sm font-semibold text-slate-700 mb-3">Losse kaartjes (ticketnummers)</h2>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Beginnummer</label>
              <input type="number" id="beginnummer" min="0" placeholder="bijv. 1201"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none"
                oninput="berekenKaartjes()" />
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Eindnummer</label>
              <input type="number" id="eindnummer" min="0" placeholder="bijv. 1247"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none"
                oninput="berekenKaartjes()" />
            </div>
          </div>
          <div class="mt-3 flex items-center justify-between bg-emerald-50 rounded-lg px-3 py-2">
            <span class="text-sm text-emerald-800">Aantal kaartjes</span>
            <span id="aantal-kaartjes" class="text-lg font-bold text-emerald-700">—</span>
          </div>
        </div>

        <!-- Abonnementen -->
        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <h2 class="text-sm font-semibold text-slate-700 mb-3">Abonnementen</h2>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Jeugd</label>
              <input type="number" id="abonnement_jeugd" min="0" value="0"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">65+</label>
              <input type="number" id="abonnement_senior" min="0" value="0"
                class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
          </div>
        </div>

        <!-- Overige getallen -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <label class="block text-xs text-slate-500 mb-1">Watertemp (°C)</label>
            <input type="number" id="watertemp" step="0.1" placeholder="23.0"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <label class="block text-xs text-slate-500 mb-1">Totaal bezoekers</label>
            <input type="number" id="totaal_bezoekers" min="0" placeholder="0"
              class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
        </div>

        <!-- Dagstaat tekst -->
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Dagstaat / Opmerkingen</label>
          <textarea id="dagstaat" rows="5" placeholder="Bijzonderheden, incidenten, weer, sfeer, etc.&#10;&#10;Je kunt hier meerdere alinea's schrijven."
            class="w-full border border-slate-300 rounded-xl px-3 py-3 bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none resize-y"></textarea>
        </div>

        <!-- Opslaan knop -->
        <button type="submit" id="btn-save"
          class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-3.5 rounded-xl shadow-md transition-colors text-base">
          Opslaan
        </button>

        <p id="form-message" class="text-center text-sm hidden"></p>
      </form>
    </section>

    <!-- ========== OVERZICHT ========== -->
    <section id="panel-list" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">Opgeslagen dagstaten</h2>
        <button onclick="downloadExcel()"
          class="text-sm bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3 py-1.5 rounded-lg shadow-sm">
          ↓ Excel
        </button>
      </div>

      <div id="entries-list" class="space-y-3">
        <!-- wordt gevuld door JS -->
      </div>

      <p id="list-empty" class="text-center text-slate-400 py-10 hidden">
        Nog geen dagstaten opgeslagen.
      </p>
    </section>

  </main>

  <!-- Status balk onderaan -->
  <div id="status-bar" class="fixed bottom-0 left-0 right-0 bg-slate-800 text-slate-200 text-xs text-center py-1.5 hidden">
    <span id="status-text"></span>
  </div>

<script>
  // ============================================
  // CONFIGURATIE – hier later Supabase invullen
  // ============================================
  const SUPABASE_URL = '';          // bijv. 'https://xxxxx.supabase.co'
  const SUPABASE_ANON_KEY = '';     // de 'anon' / 'public' key

  let supabase = null;
  if (SUPABASE_URL && SUPABASE_ANON_KEY) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  // ============================================
  // Helpers
  // ============================================
  function todayISO() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }

  function berekenKaartjes() {
    const begin = parseInt(document.getElementById('beginnummer').value) || 0;
    const eind  = parseInt(document.getElementById('eindnummer').value) || 0;
    const el = document.getElementById('aantal-kaartjes');
    if (begin > 0 && eind >= begin) {
      el.textContent = eind - begin + 1;
    } else {
      el.textContent = '—';
    }
  }

  function showTab(tab) {
    document.getElementById('panel-form').classList.toggle('hidden', tab !== 'form');
    document.getElementById('panel-list').classList.toggle('hidden', tab !== 'list');
    document.getElementById('tab-form').classList.toggle('tab-active', tab === 'form');
    document.getElementById('tab-list').classList.toggle('tab-active', tab === 'list');
    document.getElementById('tab-form').classList.toggle('text-emerald-100', tab !== 'form');
    document.getElementById('tab-list').classList.toggle('text-emerald-100', tab !== 'list');
    if (tab === 'list') loadEntries();
  }

  function showMessage(text, isError = false) {
    const el = document.getElementById('form-message');
    el.textContent = text;
    el.className = 'text-center text-sm ' + (isError ? 'text-red-600' : 'text-emerald-600');
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 4000);
  }

  // ============================================
  // LocalStorage (werkt altijd, ook zonder Supabase)
  // ============================================
  function getLocalEntries() {
    try {
      return JSON.parse(localStorage.getItem('tuindorpbad_dagstaten') || '[]');
    } catch {
      return [];
    }
  }

  function saveLocalEntry(entry) {
    const list = getLocalEntries();
    list.unshift(entry);
    localStorage.setItem('tuindorpbad_dagstaten', JSON.stringify(list));
  }

  // ============================================
  // Opslaan
  // ============================================
  async function saveEntry(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Bezig…';

    const begin = parseInt(document.getElementById('beginnummer').value) || null;
    const eind  = parseInt(document.getElementById('eindnummer').value) || null;
    let aantal = null;
    if (begin && eind && eind >= begin) aantal = eind - begin + 1;

    const entry = {
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
      datum: document.getElementById('datum').value,
      naam: document.getElementById('naam').value.trim(),
      beginnummer: begin,
      eindnummer: eind,
      aantal_kaartjes: aantal,
      abonnement_jeugd: parseInt(document.getElementById('abonnement_jeugd').value) || 0,
      abonnement_senior: parseInt(document.getElementById('abonnement_senior').value) || 0,
      watertemp: document.getElementById('watertemp').value ? parseFloat(document.getElementById('watertemp').value) : null,
      totaal_bezoekers: document.getElementById('totaal_bezoekers').value ? parseInt(document.getElementById('totaal_bezoekers').value) : null,
      dagstaat: document.getElementById('dagstaat').value.trim(),
      created_at: new Date().toISOString()
    };

    try {
      // Altijd lokaal opslaan (fallback + offline)
      saveLocalEntry(entry);

      // Probeer ook naar Supabase te sturen als geconfigureerd
      if (supabase) {
        const { error } = await supabase.from('dagstaten').insert([{
          datum: entry.datum,
          naam: entry.naam,
          beginnummer: entry.beginnummer,
          eindnummer: entry.eindnummer,
          aantal_kaartjes: entry.aantal_kaartjes,
          abonnement_jeugd: entry.abonnement_jeugd,
          abonnement_senior: entry.abonnement_senior,
          watertemp: entry.watertemp,
          totaal_bezoekers: entry.totaal_bezoekers,
          dagstaat: entry.dagstaat
        }]);
        if (error) throw error;
        showMessage('Opgeslagen in de cloud ✓');
      } else {
        showMessage('Opgeslagen op dit apparaat ✓ (Supabase nog niet gekoppeld)');
      }

      // Formulier resetten (behalve datum)
      document.getElementById('naam').value = '';
      document.getElementById('beginnummer').value = '';
      document.getElementById('eindnummer').value = '';
      document.getElementById('aantal-kaartjes').textContent = '—';
      document.getElementById('abonnement_jeugd').value = 0;
      document.getElementById('abonnement_senior').value = 0;
      document.getElementById('watertemp').value = '';
      document.getElementById('totaal_bezoekers').value = '';
      document.getElementById('dagstaat').value = '';

    } catch (err) {
      console.error(err);
      showMessage('Fout bij opslaan: ' + (err.message || err), true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Opslaan';
    }
  }

  // ============================================
  // Overzicht laden
  // ============================================
  async function loadEntries() {
    const container = document.getElementById('entries-list');
    const empty = document.getElementById('list-empty');
    container.innerHTML = '<p class="text-center text-slate-400 py-6">Laden…</p>';

    let entries = [];

    if (supabase) {
      const { data, error } = await supabase
        .from('dagstaten')
        .select('*')
        .order('datum', { ascending: false })
        .order('created_at', { ascending: false });
      if (!error && data) entries = data;
    }

    // Fallback / merge met lokale data
    const local = getLocalEntries();
    if (entries.length === 0) {
      entries = local;
    }

    if (entries.length === 0) {
      container.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    container.innerHTML = entries.map(e => `
      <article class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
        <div class="flex justify-between items-start mb-2">
          <div>
            <div class="font-semibold text-slate-800">${e.datum || '—'}</div>
            <div class="text-sm text-slate-500">${e.naam || ''}</div>
          </div>
          <div class="text-right text-sm">
            ${e.aantal_kaartjes != null ? `<div class="font-medium text-emerald-700">${e.aantal_kaartjes} kaartjes</div>` : ''}
            ${e.watertemp != null ? `<div class="text-slate-500">${e.watertemp}°C</div>` : ''}
          </div>
        </div>
        <div class="text-xs text-slate-500 grid grid-cols-2 gap-1 mb-2">
          <span>Abo jeugd: ${e.abonnement_jeugd ?? 0}</span>
          <span>Abo 65+: ${e.abonnement_senior ?? 0}</span>
          ${e.beginnummer ? `<span>Tickets: ${e.beginnummer}–${e.eindnummer}</span>` : ''}
          ${e.totaal_bezoekers != null ? `<span>Bezoekers: ${e.totaal_bezoekers}</span>` : ''}
        </div>
        ${e.dagstaat ? `<p class="text-sm text-slate-700 whitespace-pre-wrap border-t border-slate-100 pt-2 mt-2">${e.dagstaat}</p>` : ''}
      </article>
    `).join('');
  }

  // ============================================
  // Excel / CSV download
  // ============================================
  function downloadExcel() {
    let entries = getLocalEntries();
    // Als Supabase actief is, zouden we hier de cloud-data kunnen gebruiken,
    // maar voor eenvoud gebruiken we wat er lokaal staat + eventueel later uitbreiden.

    if (entries.length === 0) {
      alert('Geen gegevens om te downloaden.');
      return;
    }

    const headers = [
      'Datum','Naam','Beginnummer','Eindnummer','Aantal kaartjes',
      'Abonnement jeugd','Abonnement 65+','Watertemp','Totaal bezoekers','Dagstaat','Opgeslagen op'
    ];

    const rows = entries.map(e => [
      e.datum || '',
      e.naam || '',
      e.beginnummer ?? '',
      e.eindnummer ?? '',
      e.aantal_kaartjes ?? '',
      e.abonnement_jeugd ?? 0,
      e.abonnement_senior ?? 0,
      e.watertemp ?? '',
      e.totaal_bezoekers ?? '',
      (e.dagstaat || '').replace(/"/g, '""'),
      e.created_at || ''
    ]);

    let csv = headers.join(';') + '\n';
    rows.forEach(r => {
      csv += r.map(cell => `"${cell}"`).join(';') + '\n';
    });

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tuindorpbad-dagstaten-${todayISO()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ============================================
  // Start
  // ============================================
  document.getElementById('datum').value = todayISO();

  // Toon status of we cloud of alleen lokaal gebruiken
  const status = document.getElementById('status-bar');
  const statusText = document.getElementById('status-text');
  if (supabase) {
    statusText.textContent = 'Verbonden met Supabase';
    status.classList.remove('hidden');
  } else {
    statusText.textContent = 'Demo-modus (alleen dit apparaat) – koppel Supabase via de code';
    status.classList.remove('hidden');
  }
</script>
</body>
</html>
